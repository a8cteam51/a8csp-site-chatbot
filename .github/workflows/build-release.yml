name: Build and Release

on:
  release:
    types: [ released ]
  # Temporary: also run on PR pushes so the workflow can be smoke-tested
  # before merging. Remove this trigger before merging to trunk — the
  # release-attachment step has nothing to attach to outside a release context.
  pull_request:
    paths:
      - '.github/workflows/build-release.yml'
      - 'composer.json'
      - 'composer.lock'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate composer.json and composer.lock
        run: composer validate --strict

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v3
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-dev --optimize-autoloader --prefer-dist --no-progress

      - name: Prepare Release Directory
        run: |
          mkdir a8csp-site-chatbot
          cp -r a8csp-site-chatbot.php LICENSE README.md composer.json composer.lock includes assets blocks vendor a8csp-site-chatbot/

      - name: Zip Release
        run: |
          zip -r ${{ github.event.repository.name }}.zip ./a8csp-site-chatbot

      - name: Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ github.event.repository.name }}.zip
